name: Validate

on:
  push:
  pull_request:
  schedule:
    # Catches breakage caused by new Home Assistant releases rather than by
    # changes in this repository.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check requires the integration to be registered in the
          # home-assistant/brands repository, which only applies once the
          # integration is submitted as a HACS default repository.
          ignore: brands
