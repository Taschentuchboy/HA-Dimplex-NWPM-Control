name: Bug report
description: Report a problem with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please note that this integration was written
        entirely by an AI and comes with no warranty – see the README.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. 0.6.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.8.1"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Heat pump / WPM software
      placeholder: "e.g. LA 11PS, WPM L/M"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >
        Enable debug logging with
        `logger: logs: custom_components.dimplex_nwpm: debug`
      render: text
