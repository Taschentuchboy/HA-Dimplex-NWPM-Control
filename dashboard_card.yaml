# =============================================================================
# OPTIONAL: example automations
# =============================================================================
#
# Release hot water for 90 minutes when someone gets home:
#
# alias: Release hot water on arrival
# triggers:
#   - trigger: state
#     entity_id: person.alex
#     to: home
# conditions:
#   - condition: time
#     after: "16:00:00"
#     before: "22:00:00"
# actions:
#   - action: dimplex_nwpm.bypass_hot_water_lock
#     data:
#       duration: 90
# mode: single
#
# -----------------------------------------------------------------------------
# Start a disinfection run from an automation (e.g. on solar surplus):
#
# alias: Disinfection on solar surplus
# triggers:
#   - trigger: numeric_state
#     entity_id: sensor.pv_surplus
#     above: 3000
#     for: "00:15:00"
# actions:
#   - action: dimplex_nwpm.start_thermal_disinfection
# mode: single
#
# -----------------------------------------------------------------------------
# React to the end of a run. The integration fires these events:
#   dimplex_nwpm_thermal_disinfection_triggered  (run scheduled)
#   dimplex_nwpm_thermal_disinfection_running    (heat pump has started)
#   dimplex_nwpm_thermal_disinfection_finished   (data: reason)
#     reason: completed | not_started | timeout | cancelled
#
# alias: Notify when disinfection finished
# triggers:
#   - trigger: event
#     event_type: dimplex_nwpm_thermal_disinfection_finished
# actions:
#   - action: notify.persistent_notification
#     data:
#       message: >-
#         Thermal disinfection finished ({{ trigger.event.data.reason }}).
